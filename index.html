      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.enabled = true;
        }
        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        }
        playClick() {
          if (!this.enabled) return;
          try {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.04);
          } catch(e) {}
        }

          if (!this.enabled) return;

            this.init();

              gain.gain.linearRampToValueAtTime(0.12, now + idx * 0.06 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.35);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + idx * 0.06);

      // --- Helpers ---
      function formatCurrency(amount) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amount);
      }

      function formatSimTime(totalMins) {
        const h = Math.floor(totalMins / 60) % 24;
        const m = totalMins % 60;
        const p = h >= 12 ? 'PM' : 'AM';
        const dh = h % 12 === 0 ? 12 : h % 12;
        return `${dh.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')} ${p}`;
      }

      function formatSlaCountdown(minutesRemaining) {
        if (minutesRemaining < 0) {
          const overdueMins = Math.abs(minutesRemaining);
          const hours = Math.floor(overdueMins / 60);
          const mins = overdueMins % 60;
          const text = hours > 0 ? `-${hours}h ${mins}m OVERDUE` : `-${mins}m OVERDUE`;
          return { text, isOverdue: true };
        }
        const hours = Math.floor(minutesRemaining / 60);
        const mins = minutesRemaining % 60;
        const text = hours > 0 ? `${hours}h ${mins}m left` : `${mins}m left`;
        return { text, isOverdue: false };
      }

      function showToast(title, message, type = 'success') {
        const id = 't-' + Date.now();
        state.toasts.unshift({ id, title, message, type });
        state.toasts = state.toasts.slice(0, 4);
        renderToasts();
        setTimeout(() => {
          state.toasts = state.toasts.filter(t => t.id !== id);
          renderToasts();
        }, 5000);
      }

      function renderToasts() {
        const root = document.getElementById('toast-root');
        if (!root) return;
        root.innerHTML = state.toasts.map(t => `
          <div class="pointer-events-auto p-4 rounded-2xl bg-slate-900 border border-cyan-500/80 shadow-[0_0_25px_rgba(6,182,212,0.3)] backdrop-blur-xl text-slate-100 flex items-start space-x-3 animate-slide-up">
            <span class="text-xl">⚡</span>
            <div class="flex-1">
              <h4 class="font-bold text-sm text-slate-100">${t.title}</h4>
              <p class="text-xs text-slate-300 mt-0.5">${t.message}</p>
            </div>
            <button onclick="window.flowforge.dismissToast('${t.id}')" class="text-slate-400 hover:text-slate-200 text-xs">✕</button>
          </div>
        `).join('');
      }

      function exportCSV() {
        const headers = ['Order ID', 'Customer', 'Tier', 'Priority', 'SLA Deadline', 'Items Qty', 'Total Value ($)', 'Status'];
        const rows = state.orders.map(o => [o.id, `"${o.customerName}"`, o.customerTier, o.priority, o.slaDeadline, o.items.length, o.totalValue, o.fulfillmentStatus].join(','));
        const csv = [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `flowforge-orders-${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('CSV Export Ready', 'Exported orders dataset successfully.', 'info');
      }

        approveReallocation(conflictId) {
          const conf = state.conflicts.find(c => c.id === conflictId);
          if (!conf) return;

          state.orders = state.orders.map(ord => {
            if (ord.id === conf.criticalOrderId) {
              return {
                ...ord,
                allocationStatus: 'Fully Allocated',
                fulfillmentStatus: 'Allocated',
                notes: `Stock secured: +3 units SKU-1001 reallocated from ${conf.lowerOrderId}.`,
                items: ord.items.map(it => it.sku === conf.sku ? { ...it, quantityAllocated: it.quantityRequested } : it),
                history: [...ord.history, { timestamp: formatSimTime(state.simMinutes), event: `Reallocated +3 units SKU-1001 from ${conf.lowerOrderId}`, actor: 'Decision Engine' }]
              };
            }
            if (ord.id === conf.lowerOrderId) {
              return {
                ...ord,
                allocationStatus: 'Partially Allocated',
                items: ord.items.map(it => it.sku === conf.sku ? { ...it, quantityAllocated: it.quantityAllocated - 3 } : it),
                history: [...ord.history, { timestamp: formatSimTime(state.simMinutes), event: `Transferred 3 units to priority order ${conf.criticalOrderId}`, actor: 'Decision Engine' }]
              };
            }
            return ord;
          });

          conf.resolved = true;

          // Add picking task for Elena
          state.tasks.unshift({
            id: 'TSK-209',
            orderId: conf.criticalOrderId,
            customerName: conf.criticalCustomer,
            pickerName: 'Elena Rostova',
            pickerId: 'PCK-02',
            zone: 'A1',
            itemCount: 14,
            dueTime: '11:00 AM',
            minutesRemaining: 45,

          sound.playSuccess();
          showToast('Critical Order Allocation Secured', 'Critical order allocation secured. SLA risk removed.', 'success');
          state.tourActive = false;
          renderApp();
        },
        allocatePartial(conflictId) {
          const conf = state.conflicts.find(c => c.id === conflictId);
          if (!conf) return;
          state.orders = state.orders.map(ord => {
            if (ord.id === conf.criticalOrderId) {
              return { ...ord, allocationStatus: 'Partially Allocated', notes: 'Allocated 7 available units from shelf. Backorder queued.' };
            }
            return ord;
          });
          conf.resolved = true;
          sound.playSuccess();
          showToast('Partial Stock Allocated', 'Partial stock allocated to critical order. Remainder queued for restock.', 'warning');
          renderApp();
        },
        openReorder(sku) {
          const it = state.inventory.find(i => i.sku === sku);
          if (it) {
            state.reorderItem = it;
            state.reorderQty = it.reorderLevel * 2;
            renderModals();
          }
        },
        confirmReorder(sku, qty) {
          state.inventory = state.inventory.map(item => {
            if (item.sku === sku) {
              const onHand = item.onHand + qty;
              return {
                ...item,
                onHand,
                available: Math.max(0, onHand - item.reserved),
                status: 'Healthy'
              };
            }
            return item;
          });
          sound.playSuccess();
          showToast('Purchase Order Authorized', `Restocked +${qty} units of ${sku}. Inventory restored to Healthy.`, 'success');
          state.reorderItem = null;
          renderApp();
        },
        openReassign(task) {
          state.reassignTask = task;
          state.selectedPickerTarget = 'PCK-02';
          renderModals();
        },
        confirmReassign(taskId, targetPickerId) {
          const targetPicker = state.pickers.find(p => p.id === targetPickerId) || state.pickers[1];
          state.tasks = state.tasks.map(t => {
            if (t.id === taskId) {
              return {
                ...t,
                pickerId: targetPicker.id,
                pickerName: targetPicker.name,
                status: 'In Progress',
                isBottleneck: false
              };
            }
            return t;
          });
          sound.playSuccess();
          showToast('Picker Reassigned', `Task reassigned to ${targetPicker.name}. Zone B2 bottleneck cleared!`, 'success');
          state.reassignTask = null;
          renderApp();
        },
        openException(ex) {
          state.resolveException = ex;
          state.resolveOption = 'recommended';
          renderModals();
        },
        confirmResolveException(exId) {
          const ex = state.exceptions.find(e => e.id === exId);
          if (ex && ex.id === 'EX-901') {
            state.orders = state.orders.map(ord => {
              if (ord.id === ex.orderId) {
                return {
                  ...ord,
                  fulfillmentStatus: 'Picking',
                  notes: 'Substituted SKU-1008 with Rev B (SKU-1010). Picking resumed.',
                  items: ord.items.map(it => it.sku === 'SKU-1008' ? { ...it, sku: 'SKU-1010', name: 'Brushless DC Motor 48V (Rev B)' } : it),
                  history: [...ord.history, { timestamp: formatSimTime(state.simMinutes), event: 'Exception EX-901 resolved: Substituted SKU-1008 with SKU-1010', actor: 'Decision Engine' }]
                };
              }
              return ord;
            });
          }
          if (ex) ex.status = 'Resolved';
          sound.playSuccess();
          showToast('Exception Resolved', `Incident ${exId} cleared. Order fulfillment resumed.`, 'success');
          state.resolveException = null;
          renderApp();
        },
        advanceOrder(orderId) {
          const stages = ['Created', 'Allocated', 'Picking', 'Packed', 'Quality Check', 'Dispatched'];
          state.orders = state.orders.map(ord => {
            if (ord.id === orderId) {
              const curIdx = stages.indexOf(ord.fulfillmentStatus);
              const next = curIdx < stages.length - 1 ? stages[curIdx + 1] : ord.fulfillmentStatus;
              return {
                ...ord,
                fulfillmentStatus: next,
                history: [...ord.history, { timestamp: formatSimTime(state.simMinutes), event: `Stage advanced to ${next}`, actor: 'Operations Manager' }]
              };
            }
            return ord;
          });
          if (state.selectedOrder && state.selectedOrder.id === orderId) {
            state.selectedOrder = state.orders.find(o => o.id === orderId);
          }
          showToast('Order Advanced', `Order ${orderId} moved to next workflow stage.`, 'info');
          renderApp();
        },
        advanceTask(taskId) {
          const stages = ['Ready', 'In Progress', 'Packed', 'Quality Check'];
          state.tasks = state.tasks.map(t => {
            if (t.id === taskId) {
              const curIdx = stages.indexOf(t.status);
              const next = curIdx >= 0 && curIdx < stages.length - 1 ? stages[curIdx + 1] : t.status;
              return { ...t, status: next, isBottleneck: false };
            }
            return t;
          });
          showToast('Task Board Updated', 'Task moved to next stage.', 'info');
          renderApp();
        },
        openOrder(order) {
          state.selectedOrder = order;
          renderModals();
        },
        closeModal() {
          state.selectedOrder = null;
          state.reorderItem = null;
          state.reassignTask = null;
          state.resolveException = null;
          renderModals();
        },
        dismissToast(id) {
          state.toasts = state.toasts.filter(t => t.id !== id);
          renderToasts();
        }

                </div>

                <div class="flex justify-between items-center pt-3 border-t border-slate-800">
                  <div class="text-xs text-slate-400">Total: <strong class="text-cyan-400 font-mono text-sm">${formatCurrency(o.totalValue)}</strong></div>
                  <div class="flex space-x-2">
                    <button onclick="window.flowforge.closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs">Close</button>
                    ${o.fulfillmentStatus !== 'Dispatched' ? `
                      <button onclick="window.flowforge.advanceOrder('${o.id}')" class="px-4 py-2 rounded-xl text-xs font-bold bg-cyan-500 text-slate-950">⚡ Advance Workflow</button>
                    ` : ''}
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        // 2. Reorder Modal
        else if (state.reorderItem) {
          const item = state.reorderItem;
          content = `
            <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
              <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-md w-full space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 class="font-mono font-bold text-slate-100">Restock ${item.sku}</h3>
                  <button onclick="window.flowforge.closeModal()" class="text-slate-400">✕</button>
                </div>
                <div class="text-xs text-slate-300 space-y-1">
                  <div><strong>${item.name}</strong></div>
                  <div>On Hand: ${item.onHand} • Reserved: ${item.reserved} • Available: ${item.available}</div>
                  <div>Lead Time: <strong>${item.leadTimeDays} Business Days</strong></div>
                </div>
                <div>
                  <label class="text-xs font-semibold text-slate-300 block mb-1">Batch Quantity:</label>
                  <input
                    type="number"
                    min="5"
                    max="500"
                    step="5"
                    value="${state.reorderQty}"
                    oninput="state.reorderQty = parseInt(this.value) || 20;"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 font-mono text-cyan-300 text-xs"
                  />
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                  <button onclick="window.flowforge.closeModal()" class="px-3 py-1.5 rounded bg-slate-800 text-xs">Cancel</button>
                  <button
                    onclick="window.flowforge.confirmReorder('${item.sku}', state.reorderQty)"
                    class="px-4 py-1.5 rounded text-xs font-bold bg-cyan-500 text-slate-950"
                  >
                    Confirm Restock
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        // 3. Reassign Modal
        else if (state.reassignTask) {
          const t = state.reassignTask;
          content = `
            <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
              <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-lg w-full space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 class="font-mono font-bold text-slate-100">Reassign ${t.id}</h3>
                  <button onclick="window.flowforge.closeModal()" class="text-slate-400">✕</button>
                </div>
                <div class="text-xs text-slate-300">
                  Order: <strong class="text-slate-100">${t.orderId}</strong> (${t.customerName}) • Current: <strong class="text-amber-300">${t.pickerName}</strong> (${t.zone})
                </div>
                <div class="space-y-2">
                  <label class="text-xs font-semibold text-slate-300 block">Select Available Alternative Picker:</label>
                  ${state.pickers.filter(p => p.id !== t.pickerId).map(p => `
                    <div
                      onclick="state.selectedPickerTarget = '${p.id}'; renderModals();"
                      class="p-3 rounded-xl border text-xs cursor-pointer flex justify-between items-center ${state.selectedPickerTarget === p.id ? 'bg-cyan-950/40 border-cyan-500' : 'bg-slate-950/60 border-slate-800'}"
                    >
                      <div>
                        <div class="font-bold text-slate-100">${p.name} <span class="font-normal text-slate-400">(Zone ${p.zone})</span></div>
                        <div class="text-[11px] text-slate-400">Load: ${p.activeTasks}/4 tasks • Efficiency: <span class="text-emerald-400 font-mono font-bold">${p.efficiencyRating}%</span></div>
                      </div>
                      <span class="px-2 py-0.5 rounded text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800">${p.currentStatus}</span>
                    </div>
                  `).join('')}
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                  <button onclick="window.flowforge.closeModal()" class="px-3 py-1.5 rounded bg-slate-800 text-xs">Cancel</button>
                  <button
                    onclick="window.flowforge.confirmReassign('${t.id}', state.selectedPickerTarget)"
                    class="px-4 py-1.5 rounded text-xs font-bold bg-cyan-500 text-slate-950"
                  >
                    Confirm Reassignment
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        // 4. Resolve Exception Modal
        else if (state.resolveException) {
          const ex = state.resolveException;
          content = `
            <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
              <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-lg w-full space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 class="font-mono font-bold text-slate-100">Resolve Exception ${ex.id}</h3>
                  <button onclick="window.flowforge.closeModal()" class="text-slate-400">✕</button>
                </div>
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-1">
                  <div class="font-bold text-slate-200">${ex.sku} — ${ex.skuName}</div>
                  <p class="text-rose-300">${ex.issueDescription}</p>
                </div>
                <div class="space-y-2">
                  <div
                    onclick="state.resolveOption = 'recommended'; renderModals();"
                    class="p-3 rounded-xl border text-xs cursor-pointer ${state.resolveOption === 'recommended' ? 'bg-cyan-950/40 border-cyan-500' : 'bg-slate-950 border-slate-800'}"
                  >
                    <div class="font-bold text-cyan-300">Option A: FlowForge Recommended (Instant)</div>
                    <p class="text-slate-300 mt-0.5">${ex.recommendedResolution}</p>
                  </div>
                  <div
                    onclick="state.resolveOption = 'manual'; renderModals();"
                    class="p-3 rounded-xl border text-xs cursor-pointer ${state.resolveOption === 'manual' ? 'bg-cyan-950/40 border-cyan-500' : 'bg-slate-950 border-slate-800'}"
                  >
                    <div class="font-bold text-slate-200">Option B: Hold for Supervisor Physical Audit</div>
                    <p class="text-slate-400 mt-0.5">Quarantine line item and hold order. Estimated 4 hour delay.</p>
                  </div>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                  <button onclick="window.flowforge.closeModal()" class="px-3 py-1.5 rounded bg-slate-800 text-xs">Cancel</button>
                  <button
                    onclick="window.flowforge.confirmResolveException('${ex.id}')"
                    class="px-4 py-1.5 rounded text-xs font-bold bg-cyan-500 text-slate-950"
                  >
                    Execute Resolution
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        root.innerHTML = content;
      }

      // Initial Mount
      document.addEventListener('DOMContentLoaded', () => {
        renderApp();
      });
      if (document.readyState !== 'loading') {
        renderApp();
      }
    })();
  </script>
</body>
</html>
